# Ollama running on this machine outside Docker (the native app on a Mac, which
# uses the Apple GPU). Chosen by ./install.sh.
#
# The backend keeps no route to the internet: it reaches Ollama through the
# proxy, which forwards only to host.docker.internal:11434 (Caddyfile.native-ollama).
services:
  backend:
    environment:
      OLLAMA_URL: http://proxy:11434

  proxy:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile.base:ro
      - ./Caddyfile.native-ollama:/etc/caddy/Caddyfile:ro
