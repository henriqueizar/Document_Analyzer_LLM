# Local development services.
#
#   docker compose up -d                       -> Postgres only (recommended on macOS:
#                                                 run Ollama natively, it uses the Apple GPU)
#   docker compose --profile ollama up -d      -> Postgres + Ollama in Docker (CPU only)
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile ollama up -d
#                                              -> Postgres + Ollama with an NVIDIA GPU
#                                                 (Linux / Windows + WSL2 only)
#
# Ports are bound to 127.0.0.1 so the database and the LLM are not exposed to
# the local network.

services:
  postgres:
    image: postgres:16
    container_name: paggo_postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: paggo
      POSTGRES_PASSWORD: paggo
      POSTGRES_DB: paggo_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  ollama_data:
